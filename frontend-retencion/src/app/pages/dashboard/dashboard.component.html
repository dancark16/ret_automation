<h2>Dashboard</h2>

<div class="stats">
    <mat-card>
        <mat-card-content>
            <div class="stat-number blue">{{ pendientes }}</div>
            <div class="stat-label">Pendientes</div>
        </mat-card-content>
    </mat-card>

    <mat-card>
        <mat-card-content>
            <div class="stat-number green">{{ completadas }}</div>
            <div class="stat-label">Completadas</div>
        </mat-card-content>
    </mat-card>

    <mat-card>
        <mat-card-content>
            <div class="stat-number red">{{ errores }}</div>
            <div class="stat-label">Con error</div>
        </mat-card-content>
    </mat-card>
</div>

<div class="actions">
    <button mat-raised-button color="primary" (click)="sincronizar()" [disabled]="syncing">
        <mat-icon>sync</mat-icon>
        {{ syncing ? 'Sincronizando...' : 'Sincronizar SRI' }}
    </button>

    <button mat-raised-button (click)="router.navigate(['/pendientes'])">
        <mat-icon>list</mat-icon>
        Ver pendientes
    </button>

    <button mat-stroked-button (click)="router.navigate(['/historial'])">
        <mat-icon>history</mat-icon>
        Historial
    </button>
</div>

<div class="upload">
    <input #fileInput type="file" accept=".pdf" hidden (change)="onFile(fileInput.files)">
    <button mat-stroked-button (click)="fileInput.click()">
        <mat-icon>upload_file</mat-icon>
        Subir PDF manualmente
    </button>
</div>
