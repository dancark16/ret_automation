<h2>Retenciones pendientes</h2>

<table mat-table [dataSource]="retenciones" class="full-width">

    <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha factura</th>
        <td mat-cell *matCellDef="let r">{{ r.invoice_date }}</td>
    </ng-container>

    <ng-container matColumnDef="cliente">
        <th mat-header-cell *matHeaderCellDef>Cliente</th>
        <td mat-cell *matCellDef="let r">{{ r.client_name }}</td>
    </ng-container>

    <ng-container matColumnDef="factura">
        <th mat-header-cell *matHeaderCellDef>Factura</th>
        <td mat-cell *matCellDef="let r">{{ r.invoice_sequential }}</td>
    </ng-container>

    <ng-container matColumnDef="retencion">
        <th mat-header-cell *matHeaderCellDef>No. Retención</th>
        <td mat-cell *matCellDef="let r">{{ r.ret_number }}</td>
    </ng-container>

    <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let r">
            <mat-chip-row [color]="chipColor(r.status)" highlighted>{{ r.status }}</mat-chip-row>
        </td>
    </ng-container>

    <ng-container matColumnDef="accion">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r">
            <button mat-icon-button (click)="router.navigate(['/detalle', r.id])">
                <mat-icon>chevron_right</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="eliminar(r.id, $event)">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let r; columns: cols" class="clickable-row" (click)="router.navigate(['/detalle', r.id])">
    </tr>
</table>

<p class="empty-msg" *ngIf="!retenciones.length">
    No hay retenciones pendientes. Sincroniza el SRI o sube un PDF desde el dashboard.
</p>
